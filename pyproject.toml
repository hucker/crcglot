[project]
name = "crcglot"
dynamic = ["version"]
description = "Deterministic CRC toolkit: compute, detect, reverse-engineer, verify, and generate execution-verified code (C/C++, C#, Go, Java, Lua, Python, Rust, TypeScript, Zig, Verilog, VHDL). Catalogue-driven, zero-dependency core, optional MCP server for AI assistants."
license = "MIT"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Chuck Bass", email = "chuck@acrocad.net" }]
keywords = [
    "crc",
    "checksum",
    "reveng",
    "rocksoft",
    "williams",
    "detect",
    "reverse-engineering",
    "verify",
    "mcp",
    "code-generation",
    "embedded",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [] # pure stdlib

[project.optional-dependencies]
# MCP server -- exposes crcglot's CLI surface as a Model Context Protocol
# server so LLM clients (Claude Desktop, Cursor, mcp-cli, etc.) can call
# detect / encode / generate as named tools.  Optional; base install
# stays pure-stdlib.  See docs/MCP.md.
# >=2: the server is written against mcp 2.0's MCPServer API (2.0
# removed the 1.x FastMCP class).  crcglot 0.29.x is the last line that
# supports mcp 1.x.  <3 caps the next major before it can break a fresh
# install the way 2.0 did.
mcp = ["mcp>=2,<3"]

[project.scripts]
crcglot = "crcglot.cli:main"
crcglot-mcp = "crcglot.mcp:main"

[project.urls]
Homepage = "https://github.com/hucker/crcglot"
Repository = "https://github.com/hucker/crcglot"
Issues = "https://github.com/hucker/crcglot/issues"

[build-system]
# setuptools chosen because crcglot now ships a small CPython C
# extension (``crcglot._c``).  The previous ``uv_build`` backend is
# pure-Python only.  setuptools is the most-documented PEP 517
# backend for native extensions and abi3 wheel-building; cibuildwheel
# tooling assumes it; mountains of examples online use it.
# >=84: the first release that tags abi3t wheels (PEP 803) and names
# free-threaded extension files; older versions reject the free-threaded
# limited-API build outright.
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# The version is written once, in src/crcglot/_version.py; setuptools reads
# the attribute statically, so a build does not import the package.
[tool.setuptools.dynamic]
version = { attr = "crcglot._version.__version__" }

# The C extension is declared in setup.py, not here: one source compiles
# three ways (abi3 for GIL builds, abi3t for free-threaded 3.15+, version-
# specific for free-threaded 3.13 / 3.14) and a static TOML table cannot
# vary by interpreter.  setup.py also sets the wheel's ABI tag per mode.

[tool.cibuildwheel]
# Three wheels per platform, chosen so no interpreter needs a rebuild on a
# new CPython release where its ABI allows it (setup.py picks the compile
# mode for each):
#   cp311-*  -> cp311-abi3        every GIL build from 3.11 on
#   cp315t-* -> cp315-abi3.abi3t  every build, GIL or free-threaded, from
#                                 3.15 on (PEP 803; GIL 3.15 ships python3t)
#   cp314t-* -> cp314-cp314t      free-threaded 3.14, which has no stable ABI
# cibuildwheel 4.3 has no cp313t identifier; 3.13t installs from the sdist.
build = ["cp311-*", "cp314t-*", "cp315t-*"]
# Stays "build".  build-frontend = "build[uv]" was tried and failed on
# Windows + macOS with cibuildwheel 2.21.3: `uv venv` could not create an env
# from cibuildwheel's bundled (nuget / framework) Python.  Left alone at the
# 4.2.0 bump on purpose -- that bump crosses two majors and changes the
# Windows repair step, so adding a second variable to the same change would
# make a failure ambiguous.  uv still builds the sdist (see wheels.yml) and
# runs every other CI step.
build-frontend = "build"
# Pin the manylinux images to what crcglot already publishes.  cibuildwheel
# 3.0 changed the DEFAULT from manylinux2014 to manylinux_2_28, which would
# raise the glibc floor from 2.17 to 2.28 and stop older long-term-support
# distributions from installing a wheel.  That is a real change to who can
# use the package, so it is a deliberate decision rather than a side effect
# of a version bump; pinning keeps the reach the 0.31.0 wheels have.  Revisit
# on its own, weighing the frozen CentOS 7 base of manylinux2014 against the
# users it still serves.
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
# Production coverage: build glibc (manylinux) AND musl (musllinux)
# Linux wheels so Alpine / minimal-Docker users get a binary too.
# Only 32-bit targets are skipped -- i686 (32-bit x86) and win32 are
# legacy; no modern CRC workload runs there, and supporting them would
# pull in EOL toolchains.  The rare 32-bit ARMv7 Raspberry Pi is
# covered by piwheels building from the sdist.
skip = ["*_i686", "*-win32"]
# Run the C-extension parity suite inside each freshly-built wheel,
# against the INSTALLED extension (not the source tree).  The first
# command refuses silence: pytest would report the whole file as skipped
# if the extension failed to load, and cibuildwheel does not fail on
# skips, so crcglot.backend() is asserted to be "c" before pytest runs.
test-requires = "pytest"
# Clear the project's addopts (which pull in pytest-cov / pytest-xdist,
# absent from this minimal test env) with an UNQUOTED empty value.
# ``addopts=''`` would be bash-only -- cmd.exe on the Windows runners
# keeps the quotes literal, mangling the invocation so pytest mis-scopes
# and trips cibuildwheel's {project} sentinel.  ``addopts=`` is portable
# across sh and cmd, as is the && between the two commands.
test-command = "python -c \"import crcglot, sys; sys.exit(crcglot.backend() != 'c')\" && python -m pytest {project}/tests/test_c_extension.py -o addopts= -q"

# The abi3t wheel is abi3-tagged, so cibuildwheel runs ``abi3audit --strict``
# on it.  abi3audit 0.0.26 predates PEP 793 and, on ELF wheels where it also
# inspects exported symbols, reports the module's ``PyModExport__c`` entry
# point as a symbol outside the stable ABI; Windows and macOS pass because
# only imports are inspected there.  That failed both Linux jobs of the
# v0.33.0 build.  The wrapper runs the same audit and tolerates exactly that
# one export, failing on anything else.  Retire it once abi3audit learns PEP
# 793.
[[tool.cibuildwheel.overrides]]
select = "cp315t-*"
audit-command = "python {project}/scripts/abi3t_audit.py {abi3_wheel}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=crcglot --cov-report=term-missing -n auto"
markers = [
    "slow: subprocess-spawning test (compiles + runs generated code via gcc / rustc / go / dotnet / tsx / iverilog / ghdl).  Skip with -m 'not slow' for fast iteration.",
    "exhaustive: per-algorithm execution test that spawns one compiler/runtime process per case.  Superseded by the batch-execution tests (whole catalogue in one build) and DESELECTED by default; opt in with --exhaustive (e.g. --exhaustive -k crc32) for single-algorithm isolation.",
    "xdist_group: (provided by pytest-xdist) pin all cases of a batch-execution test to ONE worker so its session-scoped build runs once, not once per worker.  See CLAUDE.md 'Execution tests: batch vs exhaustive'.  Do not remove from the batch tests.",
]

[tool.coverage.run]
source = ["src/crcglot"]

[tool.coverage.report]
# "if TYPE_CHECKING:" guards the static mirror of the lazy public API in
# __init__.py -- definitionally never executed at runtime.
exclude_lines = ["if __name__", "pragma: no cover", "if TYPE_CHECKING:"]
show_missing = true

[tool.ruff.lint]
# Pin the rule set the quality gate has always been held to (ruff's
# classic defaults).  Without this, `uvx ruff check` floats on whatever
# the latest ruff enables by default -- ruff 0.16 expanded its defaults
# and retroactively flagged ~350 deliberate idioms (the generators'
# adjacent-string emit style, tests inspecting subprocess returncodes,
# tests exec()ing generated Python).  Adopting new rule families is a
# deliberate decision to make here, not upstream's release schedule.
select = ["E4", "E7", "E9", "F"]

# uv rebuilds the editable install when one of these files changes.  Its
# default key is pyproject.toml alone, so without _version.py listed a
# version bump would leave the installed metadata stale until the next
# explicit sync, and the test pinning crcglot.__version__ to
# importlib.metadata would fail inside release_prep.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "src/crcglot/_c.c" },
    { file = "src/crcglot/_version.py" },
]
default-groups = ["dev", "mcp-dev"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "setuptools>=84",  # only so editors and ty resolve setup.py; builds use isolated envs
    "pytest-cov>=7.0",
    "pytest-xdist>=3.8",
    "anycrc>=2.0.0",
    "crccheck>=1.3.1",
    "hypothesis>=6.100",
]
# The MCP server dependency sits in its own group so the free-threaded
# Windows CI job can leave it out: mcp pulls in pywin32, which ships no
# free-threaded wheels.  default-groups (under [tool.uv]) keeps a plain
# `uv sync` installing both groups, so nothing changes locally.
mcp-dev = [
    "mcp>=2,<3",  # keep in lockstep with the [mcp] extra above
]
